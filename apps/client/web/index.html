    /* Prevent tap highlight and callout, while allowing text inputs to be selectable */
    *, *::before, *::after {

    /* Drawing surface: strict touch-action and selection suppression for drawing */
    flt-glass-pane, flt-scene-host, canvas, flutter-view, .drawing-surface {

  <script>
    // =========================================================================
    // iPadOS Safari Apple Pencil Pro WebKit Stabilizer
    // =========================================================================
    // Eliminates Safari page gesture zoom and long-press callouts while allowing
    // Apple Pencil Pro pointerdown, pointermove, and pointerup events to stream
    // cleanly directly to Flutter Web's canvas without interference or cancellation.
    (function() {
      var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (!isIOS) return;

      // 1. Prevent Safari browser gesture zoom (pinch/rotate at the window level)
      document.addEventListener('gesturestart', function(e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('gesturechange', function(e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('gestureend', function(e) { e.preventDefault(); }, { passive: false });

      // 2. Prevent iOS context menu on long press (unless inside text input)
      window.addEventListener('contextmenu', function(e) {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable)) return;
        e.preventDefault();
      }, { capture: true });

      // 3. Enforce touch-action:none on Flutter's shadow DOM for Apple Pencil
      function secureRoot(root) {
        if (!root) return;
        try {
          if (!root.getElementById('pencil-shadow-fix')) {
            var style = document.createElement('style');
            style.id = 'pencil-shadow-fix';
            style.textContent = '*, *::before, *::after, canvas, flt-scene-host, flt-glass-pane { touch-action: none !important; -webkit-user-select: none !important; cursor: auto; }';
            root.appendChild(style);
          }
        } catch(err) {}
      }

      function applyTouchAction() {
        var view = document.querySelector('flutter-view, flt-glass-pane');
        if (view) {
          if (view.shadowRoot) secureRoot(view.shadowRoot);
          if (observer) {
            observer.disconnect();
            observer = null;
          }
        }
      }

      var observer = new MutationObserver(applyTouchAction);
      observer.observe(document.documentElement, { childList: true, subtree: true });
      applyTouchAction();

      // 4. Prevent Safari 3D Touch / touchforcechange on Apple Pencil canvas
      document.addEventListener('touchforcechange', function(e) {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        e.preventDefault();
      }, { passive: false });

      // 5. Prevent double-tap zoom on Safari
      document.addEventListener('dblclick', function(e) {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        e.preventDefault();
      }, { passive: false });
    })();

<body>

      .sk-mockup-toolbar {

      .sk-mockup-paper {
        flex: 1;
        background: #FAFBFD;
        border: 1px solid #EEF2F6;
        border-radius: 12px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        box-sizing: border-box;
        position: relative;
        overflow: hidden;
      }
      @media (max-width: 860px) {

          flex-direction: column;
          padding: 24px 20px;
          gap: 28px;

        .sk-hero-left { width: 100%; }
        .sk-hero-right { width: 100%; }
        .sk-mockup-card { height: 320px; }

      /* Workspace Mode Preloader for Returning Authenticated Sessions */
      #flutter-preloader.sk-workspace-view .sk-landing-view {
        display: none !important;
      }
      #flutter-preloader.sk-workspace-view .sk-workspace-view-content {
        display: flex !important;
      }

        display: none;
        width: 100%;
        height: 100%;

        display: flex;
        flex-direction: column;
        flex-shrink: 0;

      .sk-ws-center {
        flex: 1;
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
        background: #F8FAFC;
      }
      .sk-ws-top {
        height: 56px;
        border-bottom: 1px solid #E5E7EB;
        background: #FFFFFF;
        padding: 0 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .sk-ws-body {
        flex: 1;
        padding: 24px;
        display: flex;
        justify-content: center;
        overflow: hidden;
      }
      .sk-ws-doc {
        width: 100%;
        max-width: 860px;
        height: 100%;
        background: #FFFFFF;
        border: 1px solid #E5E7EB;
        border-radius: 16px;
        box-shadow: 0 4px 16px rgba(15,23,42,0.04);

        flex-direction: column;
      }
      @media (max-width: 860px) {
        .sk-ws-side { display: none; }
        .sk-ws-body { padding: 16px; }
      }
    </style>

  <script>
    (function() {
      // Storage Quota Protection: Ensures localStorage (5MB limit) never blocks Firebase Auth or critical operations
      function pruneStorageForAuth() {
        try {
          var toRemove = [];
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (!k) continue;
            // Never remove active Firebase Auth credentials or session state flags
            if (k.indexOf('firebase:') === 0 || k === 'flutter.notelekh_has_user_session' || k === 'flutter.notelekh_last_user_id') {
              continue;
            }
            // Remove cached files, notifications, and guest/anon documents
            if (k.indexOf('_files_') !== -1 ||
                k.indexOf('_notifications') !== -1 ||
                k.indexOf('notelekh_anon_') !== -1 ||
                k.indexOf('notelekh_guest_') !== -1 ||
                k.indexOf('notelekh_local_user_') !== -1) {
              toRemove.push(k);
            }
          }
          toRemove.forEach(function(r) { localStorage.removeItem(r); });

          // If still over 2MB, prune older document bodies (metadata index remains intact)
          var totalBytes = 0;
          for (var m = 0; m < localStorage.length; m++) {
            var km = localStorage.key(m);
            if (km) totalBytes += km.length + (localStorage.getItem(km) || '').length;
          }
          if (totalBytes > 2000000) {
            var docKeys = [];
            for (var n = 0; n < localStorage.length; n++) {
              var kn = localStorage.key(n);
              if (kn && kn.indexOf('_doc_') !== -1 && kn.indexOf('_index') === -1 && kn.indexOf('_active_') === -1) {
                docKeys.push(kn);
              }
            }
            docKeys.forEach(function(dk) { localStorage.removeItem(dk); });
          }
        } catch (e) {
          console.warn('[Notelekh] Storage prune error:', e);
        }
      }
      window.pruneLocalStorageForAuth = pruneStorageForAuth;

      // Wrap Storage.prototype.setItem to intercept QuotaExceededError and auto-recover
      try {
        var origSetItem = Storage.prototype.setItem;
        Storage.prototype.setItem = function(key, value) {
          try {
            origSetItem.call(this, key, value);
          } catch (err) {
            var isQuota = err && (
              err.name === 'QuotaExceededError' ||
              err.name === 'NS_ERROR_DOM_QUOTA_REACHED' ||
              (err.message && err.message.indexOf('exceeded the quota') !== -1) ||
              err.code === 22 ||
              err.code === 1014
            );
            if (isQuota) {
              console.warn('[Notelekh] Storage quota reached on setItem("' + key + '"). Auto-pruning cache...');
              pruneStorageForAuth();
              try {
                origSetItem.call(this, key, value);
                return;
              } catch (retryErr) {
                console.error('[Notelekh] Retry setItem still exceeded quota:', retryErr);
                throw retryErr;
              }
            }
            throw err;
          }
        };
      } catch (wrapErr) {
        console.warn('[Notelekh] Could not wrap Storage.prototype.setItem:', wrapErr);
      }

      // Proactively check storage size on page startup
      try {
        var startupBytes = 0;
        for (var s = 0; s < localStorage.length; s++) {
          var sk = localStorage.key(s);
          if (sk) startupBytes += sk.length + (localStorage.getItem(sk) || '').length;
        }
        if (startupBytes > 2000000) {
          console.log('[Notelekh] Startup localStorage is ' + startupBytes + ' bytes. Pruning cache...');
          pruneStorageForAuth();
        }
      } catch (_) {}

      // If user is returning from auth redirect or has pending auth, hide the landing preloader immediately
      try {
        var isRedirect = localStorage.getItem('flutter.notelekh_pending_auth_redirect') === 'true' ||
                         sessionStorage.getItem('notelekh_pending_auth_redirect') === 'true';
        if (isRedirect) {
          var pre = document.getElementById('flutter-preloader');
          if (pre) {
            pre.style.display = 'none';
          }
        }
      } catch (e) {}

      function removePreloader() {
        var el = document.getElementById('flutter-preloader');
        if (el && !el._dismissed) {
          el._dismissed = true;
          el.style.opacity = '0';
          setTimeout(function() { if (el && el.parentNode) el.parentNode.removeChild(el); }, 160);
        }
      }
      window.addEventListener('flutter-first-frame', removePreloader);
      var interval = setInterval(function() {
        if (document.querySelector('flutter-view, flt-glass-pane, canvas')) {
          removePreloader();
          clearInterval(interval);
        }
      }, 30);
      // Failsafe timeout so preloader is never stuck if an event is delayed
      setTimeout(removePreloader, 1200);
    })();
  </script>
